version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
  commit-message:
    prefix: chore(deps)
  groups:
    bundler-minor-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
  commit-message:
    prefix: chore(deps)
  groups:
    github-actions-minor-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
  open-pull-requests-limit: 5
  commit-message:
    prefix: "chore(deps)"
  groups:
    docker-minor-patch:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
